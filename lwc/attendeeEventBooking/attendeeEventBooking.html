<template>
    <div class="booking-portal-container slds-p-around_medium">

        <!-- Header / Nav Banner -->
        <header class="portal-header slds-m-bottom_large slds-p-around_medium">
            <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread slds-wrap">
                <div class="slds-col">
                    <h1 class="portal-main-title">Events &amp; Ticketing Portal</h1>
                    <p class="portal-subtitle">Discover upcoming conferences, workshops, and manage your booked passes.</p>
                </div>
                <template if:false={isBrowseState}>
                    <div class="slds-col slds-m-top_x-small">
                        <lightning-button 
                            label="Back to Browse" 
                            icon-name="utility:back" 
                            onclick={handleBackToBrowse}
                            variant="neutral">
                        </lightning-button>
                    </div>
                </template>
            </div>

            <!-- Portal Navigation Tabs: Explore Events vs My Tickets -->
            <div class="nav-tabs-bar">
                <button class={eventsTabClass} onclick={handleTabClick} data-tab="events">
                    <lightning-icon icon-name="utility:event" size="x-small" class="slds-m-right_xx-small"></lightning-icon>
                    Explore Events
                </button>
                <button class={ticketsTabClass} onclick={handleTabClick} data-tab="my-tickets">
                    <lightning-icon icon-name="utility:identity" size="x-small" class="slds-m-right_xx-small"></lightning-icon>
                    My Tickets
                    <span class="badge-count">{myTicketsCount}</span>
                </button>
            </div>
        </header>

        <!-- TAB 1: EXPLORE EVENTS -->
        <template if:true={isEventsTab}>

            <!-- STATE 1: BROWSE (List of Published Events) -->
            <template if:true={isBrowseState}>
                <!-- Search & Filters -->
                <div class="slds-grid slds-wrap slds-gutters slds-m-bottom_large filter-bar slds-p-around_small">
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_8-of-12">
                        <lightning-input 
                            type="search" 
                            label="Search Events" 
                            placeholder="Search by event name, venue, city..." 
                            value={searchKey}
                            onchange={handleSearchChange}
                            variant="label-hidden">
                        </lightning-input>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12">
                        <lightning-combobox 
                            label="Category" 
                            value={selectedCategory} 
                            placeholder="All Categories" 
                            options={categoryOptions} 
                            onchange={handleCategoryChange}
                            variant="label-hidden">
                        </lightning-combobox>
                    </div>
                </div>

                <!-- Loading Spinner -->
                <template if:true={isLoading}>
                    <div class="slds-p-around_xx-large slds-text-align_center">
                        <lightning-spinner alternative-text="Loading Events" size="medium"></lightning-spinner>
                    </div>
                </template>

                <!-- Events Grid -->
                <template if:false={isLoading}>
                    <template if:true={hasEvents}>
                        <div class="slds-grid slds-wrap slds-gutters">
                            <template for:each={filteredEvents} for:item="evt">
                                <div key={evt.Id} class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-large-size_4-of-12 slds-m-bottom_large">
                                    <div class="event-card slds-card slds-p-around_medium">
                                        <div class="event-card-header slds-m-bottom_small">
                                            <span class="category-badge">{evt.Category__c}</span>
                                            <span class={evt.statusBadgeClass}>{evt.displayStatus}</span>
                                        </div>
                                        <h2 class="event-card-title slds-text-heading_small slds-truncate" title={evt.Name}>{evt.Name}</h2>
                                        <p class="event-venue-info slds-m-top_xx-small slds-text-color_weak slds-truncate">
                                            <lightning-icon icon-name="utility:checkin" size="xx-small" class="slds-m-right_xx-small"></lightning-icon>
                                            {evt.Venue__r.Name} • {evt.Venue__r.City__c}, {evt.Venue__r.State__c}
                                        </p>
                                        <p class="event-date-info slds-m-top_xx-small slds-text-color_weak">
                                            <lightning-icon icon-name="utility:event" size="xx-small" class="slds-m-right_xx-small"></lightning-icon>
                                            {evt.formattedStartDate}
                                        </p>
                                        
                                        <div class="event-capacity-bar slds-m-vertical_small">
                                            <div class="slds-grid slds-grid_align-spread slds-text-body_small slds-m-bottom_xx-small">
                                                <span>Available Seats:</span>
                                                <strong>{evt.Available_Seats__c} / {evt.Total_Capacity__c}</strong>
                                            </div>
                                        </div>

                                        <lightning-button 
                                            variant="brand" 
                                            label="View Tickets" 
                                            data-id={evt.Id}
                                            onclick={handleSelectEvent}
                                            class="slds-button_stretch card-btn">
                                        </lightning-button>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </template>
                    <template if:false={hasEvents}>
                        <div class="empty-state slds-card slds-p-around_xx-large slds-text-align_center">
                            <lightning-icon icon-name="utility:event" size="large" class="slds-m-bottom_medium"></lightning-icon>
                            <h3 class="slds-text-heading_medium">No Published Events Available</h3>
                            <p class="slds-text-color_weak">Check back later for newly announced conferences and sessions.</p>
                        </div>
                    </template>
                </template>
            </template>

            <!-- STATE 2: DETAIL (Event Information & Ticket Type Selection) -->
            <template if:true={isDetailState}>
                <div class="detail-container slds-card slds-p-around_large slds-m-bottom_large">
                    <div class="slds-grid slds-wrap slds-gutters">
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_7-of-12">
                            <div class="category-badge slds-m-bottom_small">{selectedEvent.Category__c}</div>
                            <h2 class="detail-event-title slds-text-heading_large slds-m-bottom_small">{selectedEvent.Name}</h2>
                            <p class="detail-description slds-text-body_regular slds-m-bottom_medium">{selectedEvent.Description__c}</p>
                            
                            <div class="detail-meta slds-box slds-theme_shade slds-m-bottom_medium">
                                <p class="slds-m-bottom_xx-small">
                                    <strong>Venue:</strong> {selectedEvent.Venue__r.Name} ({selectedEvent.Venue__r.Address__c}, {selectedEvent.Venue__r.City__c}, {selectedEvent.Venue__r.State__c})
                                </p>
                                <p class="slds-m-bottom_xx-small">
                                    <strong>Date &amp; Time:</strong> {selectedEvent.formattedStartDate} to {selectedEvent.formattedEndDate}
                                </p>
                                <p class="slds-m-bottom_none">
                                    <strong>Total Venue Capacity:</strong> {selectedEvent.Venue__r.Venue_Capacity__c}
                                </p>
                            </div>
                        </div>

                        <!-- Ticket Types Selection Panel -->
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_5-of-12">
                            <h3 class="slds-text-heading_medium slds-m-bottom_medium">Select Ticket Type</h3>
                            <div class="ticket-types-list">
                                <template for:each={ticketTypes} for:item="tt">
                                    <div key={tt.Id} 
                                         class={tt.cardClass} 
                                         onclick={handleSelectTicketType} 
                                         onkeydown={handleTicketTypeKeyDown}
                                         tabindex="0"
                                         role="button"
                                         aria-label={tt.Name}
                                         data-id={tt.Id}>
                                        <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                                            <div>
                                                <h4 class="ticket-title">{tt.Name}</h4>
                                                <p class="ticket-quota slds-text-color_weak slds-text-body_small">
                                                    {tt.Available_Seats__c} seats left of {tt.Quota__c}
                                                </p>
                                            </div>
                                            <div class="slds-text-align_right">
                                                <div class="ticket-price">₹{tt.Price__c}</div>
                                                <span class={tt.statusBadgeClass}>{tt.statusLabel}</span>
                                            </div>
                                        </div>
                                    </div>
                                </template>
                            </div>

                            <!-- Ticket Counter -->
                            <template if:true={selectedTicketType}>
                                <!-- Live Capacity Quota Validation Banner -->
                                <template if:true={capacityQuotaWarning}>
                                    <div class={capacityQuotaWarning.variantClass} role="alert">
                                        <lightning-icon icon-name={capacityQuotaWarning.icon} size="x-small" class="slds-m-right_x-small"></lightning-icon>
                                        <div class="capacity-alert-content">
                                            <strong>{capacityQuotaWarning.title}: </strong>
                                            <span>{capacityQuotaWarning.message}</span>
                                        </div>
                                    </div>
                                </template>

                                <div class="ticket-counter-card slds-box slds-m-top_small slds-p-around_medium">
                                    <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread slds-m-bottom_small">
                                        <div>
                                            <span class="counter-label">Number of Tickets</span>
                                            <p class="counter-subtext">Min: 1 • Remaining Available Quota: {maxAllowedTickets}</p>
                                        </div>
                                        <div class="counter-controls">
                                            <button 
                                                class="counter-btn" 
                                                onclick={handleDecrementTickets} 
                                                disabled={isDecrementDisabled}
                                                type="button"
                                                title="Decrease tickets">
                                                -
                                            </button>
                                            <span class="counter-display">{ticketQuantity}</span>
                                            <button 
                                                class="counter-btn" 
                                                onclick={handleIncrementTickets} 
                                                disabled={isIncrementDisabled}
                                                type="button"
                                                title="Increase tickets">
                                                +
                                            </button>
                                        </div>
                                    </div>

                                    <div class="price-calc-summary slds-grid slds-grid_align-spread slds-p-top_x-small slds-border_top">
                                        <span class="slds-text-body_regular">Total ({ticketQuantity} × ₹{selectedTicketType.Price__c}):</span>
                                        <strong class="total-price-text">₹{totalCalculatedPrice}</strong>
                                    </div>
                                </div>

                                <!-- Attendee Details Section -->
                                <div class="attendees-section slds-m-top_large">
                                    <div class="slds-m-bottom_small">
                                        <h4 class="slds-text-title_bold slds-text-color_default">Attendee Details ({ticketQuantity} {attendeesPluralLabel})</h4>
                                        <p class="slds-text-body_small slds-text-color_weak">Please fill in the information for each attendee.</p>
                                    </div>

                                    <template for:each={attendeeList} for:item="att">
                                        <div key={att.index} class="attendee-card slds-box slds-m-bottom_small slds-p-around_small">
                                            <div class="attendee-header slds-m-bottom_x-small">
                                                <span class="attendee-tag">{att.label}</span>
                                            </div>
                                            <div class="slds-grid slds-wrap slds-gutters">
                                                <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12">
                                                    <lightning-input 
                                                        label="Full Name" 
                                                        value={att.name} 
                                                        data-index={att.index} 
                                                        data-field="name" 
                                                        onchange={handleAttendeeFieldChange} 
                                                        required>
                                                    </lightning-input>
                                                </div>
                                                <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12">
                                                    <lightning-input 
                                                        type="email" 
                                                        label="Email Address" 
                                                        value={att.email} 
                                                        data-index={att.index} 
                                                        data-field="email" 
                                                        onchange={handleAttendeeFieldChange} 
                                                        required>
                                                    </lightning-input>
                                                </div>
                                                <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12">
                                                    <lightning-input 
                                                        type="tel" 
                                                        label="Phone (10 Digits)" 
                                                        max-length="10" 
                                                        placeholder="9876543210" 
                                                        value={att.phone} 
                                                        data-index={att.index} 
                                                        data-field="phone" 
                                                        onchange={handleAttendeeFieldChange} 
                                                        required>
                                                    </lightning-input>
                                                </div>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </template>

                            <div class="slds-m-top_large">
                                <lightning-button 
                                    variant="brand" 
                                    label={proceedButtonLabel} 
                                    disabled={isProceedDisabled}
                                    onclick={handleProceedToBooking}
                                    class="slds-button_stretch proceed-btn">
                                </lightning-button>
                            </div>
                        </div>
                    </div>
                </div>
            </template>


            <!-- STATE 4: PAYMENT (Embedded Payment QR Verification Child LWC) -->
            <template if:true={isPaymentState}>
                <div class="payment-wrapper">
                    <c-payment-qr-verification 
                        registration-id={newRegistrationId}
                        amount={formattedTotalAmount}
                        onpaymentconfirmed={handlePaymentConfirmed}>
                    </c-payment-qr-verification>
                </div>
            </template>

            <!-- STATE 5: SOLD OUT -->
            <template if:true={isSoldOutState}>
                <div class="sold-out-card slds-card slds-p-around_xx-large slds-text-align_center">
                    <lightning-icon icon-name="utility:warning" variant="warning" size="large" class="slds-m-bottom_medium"></lightning-icon>
                    <h2 class="slds-text-heading_large slds-m-bottom_small">Tickets Sold Out</h2>
                    <p class="slds-text-color_weak slds-m-bottom_large">
                        The requested ticket type is no longer available. Please select an alternative ticket tier or browse other events.
                    </p>
                    <lightning-button 
                        variant="neutral" 
                        label="Choose Another Ticket" 
                        onclick={handleBackToDetail} 
                        class="slds-m-right_small">
                    </lightning-button>
                    <lightning-button 
                        variant="brand" 
                        label="Browse All Events" 
                        onclick={handleBackToBrowse}>
                    </lightning-button>
                </div>
            </template>

            <!-- STATE 6: SUCCESS -->
            <template if:true={isSuccessState}>
                <div class="success-card slds-card slds-p-around_xx-large slds-text-align_center">
                    <div class="success-icon-wrap slds-m-bottom_medium">
                        <lightning-icon icon-name="utility:success" variant="success" size="large"></lightning-icon>
                    </div>
                    <h2 class="success-title slds-text-heading_large slds-m-bottom_x-small">You're All Set!</h2>
                    <p class="success-subtitle slds-text-body_regular slds-text-color_weak slds-m-bottom_large">
                        Your event registration and payment have been confirmed for all attendees.
                    </p>

                    <div class="booking-receipt slds-box slds-theme_shade slds-m-bottom_large slds-text-align_left">
                        <h3 class="slds-text-title_bold slds-m-bottom_small">Booking Summary</h3>
                        <p class="slds-m-bottom_xx-small"><strong>Event:</strong> {selectedEvent.Name}</p>
                        <p class="slds-m-bottom_xx-small"><strong>Venue:</strong> {selectedEvent.Venue__r.Name}</p>
                        <p class="slds-m-bottom_xx-small"><strong>Ticket Type:</strong> {selectedTicketType.Name}</p>
                        <p class="slds-m-bottom_xx-small"><strong>Passes Confirmed:</strong> {ticketQuantity}</p>
                        <p class="slds-m-bottom_xx-small"><strong>Total Amount Paid:</strong> ₹{totalCalculatedPrice}</p>
                        <template if:true={bookingGroupId}>
                            <p class="slds-m-bottom_xx-small"><strong>Booking Reference:</strong> <code>{bookingGroupId}</code></p>
                        </template>

                        <!-- Attendees Roster -->
                        <div class="slds-m-top_small slds-p-top_small slds-border_top">
                            <h4 class="slds-text-title_bold slds-m-bottom_xx-small">Attendees Admitted ({ticketQuantity}):</h4>
                            <ul class="slds-list_dotted slds-text-body_small">
                                <template for:each={attendeeList} for:item="a">
                                    <li key={a.index}><strong>{a.name}</strong> • {a.email} ({a.phone})</li>
                                </template>
                            </ul>
                        </div>
                    </div>

                    <div class="action-row slds-grid slds-grid_align-center slds-gutters">
                        <div class="slds-col">
                            <lightning-button 
                                variant="neutral" 
                                label="Explore More Events" 
                                onclick={handleBackToBrowse}>
                            </lightning-button>
                        </div>
                        <div class="slds-col">
                            <lightning-button 
                                variant="brand" 
                                label="View My Tickets" 
                                icon-name="utility:identity" 
                                onclick={handleGoToMyTickets}>
                            </lightning-button>
                        </div>
                    </div>
                </div>
            </template>

        </template>

        <!-- TAB 2: MY TICKETS VIEW -->
        <template if:true={isMyTicketsTab}>
            <template if:true={isLoadingTickets}>
                <div class="slds-p-around_xx-large slds-text-align_center">
                    <lightning-spinner alternative-text="Loading My Tickets" size="medium"></lightning-spinner>
                </div>
            </template>

            <template if:false={isLoadingTickets}>
                <template if:true={hasMyTickets}>
                    <div class="slds-grid slds-wrap slds-gutters">
                        <template for:each={myTickets} for:item="tkt">
                            <div key={tkt.ticketId} class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-large-size_4-of-12 slds-m-bottom_large">
                                <div class={tkt.cardClass} 
                                     tabindex="0"
                                     role="button"
                                     aria-label={tkt.ticketAriaLabel}
                                     data-id={tkt.ticketId} 
                                     onclick={handleTicketCardClick} 
                                     onkeydown={handleTicketCardKeyDown}
                                     title="Click or press Enter to preview ticket pass and speakers">
                                    <div class="ticket-card-header">
                                        <span class="ticket-number">{tkt.ticketNumber}</span>
                                        <span class={tkt.badgeClass}>{tkt.status}</span>
                                    </div>
                                    <div class="ticket-card-body">
                                        <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_xx-small">
                                            <h3 class="ticket-event-name slds-truncate" title={tkt.eventName}>{tkt.eventName}</h3>
                                        </div>
                                        <div class="ticket-info-row">
                                            <lightning-icon icon-name="utility:event" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                                            <span>{tkt.formattedStartDate}</span>
                                        </div>
                                        <div class="ticket-info-row">
                                            <lightning-icon icon-name="utility:checkin" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                                            <span>{tkt.venueName}, {tkt.venueCity}</span>
                                        </div>
                                        <div class="ticket-info-row">
                                            <lightning-icon icon-name="utility:user" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                                            <span>{tkt.attendeeName}</span>
                                        </div>
                                        <div class="slds-m-top_small slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                                            <span class="category-badge">{tkt.ticketTypeName}</span>
                                            <span class="ticket-price-tag">₹{tkt.bookedPrice}</span>
                                        </div>
                                    </div>
                                    <div class="ticket-card-footer">
                                        <div>
                                            <template if:true={tkt.canCancel}>
                                                <lightning-button 
                                                    variant="destructive-text" 
                                                    label="Cancel Ticket" 
                                                    icon-name="utility:close" 
                                                    data-id={tkt.registrationId}
                                                    onclick={handleCancelBookingClick}
                                                    class="slds-m-right_x-small">
                                                </lightning-button>
                                            </template>
                                        </div>
                                        <div class="slds-grid slds-grid_vertical-align-center">
                                            <span class="preview-hint-text slds-m-right_x-small">
                                                <lightning-icon icon-name="utility:preview" size="xx-small" class="slds-m-right_xx-small"></lightning-icon>
                                                Preview
                                            </span>
                                            <lightning-button 
                                                variant="brand-outline" 
                                                label="PDF" 
                                                icon-name="utility:print" 
                                                data-url={tkt.printableTicketUrl}
                                                onclick={handlePrintTicket}>
                                            </lightning-button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                </template>

                <template if:false={hasMyTickets}>
                    <div class="empty-state slds-card slds-p-around_xx-large slds-text-align_center">
                        <lightning-icon icon-name="utility:identity" size="large" class="slds-m-bottom_medium slds-icon-text-light"></lightning-icon>
                        <h3 class="slds-text-heading_medium slds-m-bottom_x-small">No Tickets Booked Yet</h3>
                        <p class="slds-text-color_weak slds-m-bottom_medium">Browse available events and secure your pass today!</p>
                        <lightning-button variant="brand" label="Browse Events" onclick={handleGoToBrowse}></lightning-button>
                    </div>
                </template>
            </template>
        </template>

        <!-- INTERACTIVE TICKET PREVIEW MODAL -->
        <template if:true={isPreviewOpen}>
            <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-ticket" class="slds-modal slds-fade-in-open slds-modal_medium">
                <div class="slds-modal__container">
                    <header class="slds-modal__header ticket-modal-header">
                        <lightning-button-icon icon-name="utility:close"
                            alternative-text="Close"
                            variant="bare-inverse"
                            class="slds-modal__close"
                            onclick={handleClosePreview}>
                        </lightning-button-icon>
                        <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread slds-m-bottom_xx-small">
                            <div>
                                <template if:true={previewTicket.eventCategory}>
                                    <span class="category-badge slds-m-right_small">{previewTicket.eventCategory}</span>
                                </template>
                                <span class={previewTicket.badgeClass}>{previewTicket.status}</span>
                            </div>
                            <span class="ticket-modal-number">{previewTicket.ticketNumber}</span>
                        </div>
                        <h2 id="modal-heading-ticket" class="slds-text-heading_medium ticket-modal-title">
                            {previewTicket.eventName}
                        </h2>
                    </header>

                    <div class="slds-modal__content slds-p-around_large ticket-modal-body" id="modal-content-ticket">
                        <!-- Cancelled Banner if ticket is voided/cancelled -->
                        <template if:true={previewTicket.isCancelled}>
                            <div class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_medium" role="alert">
                                <lightning-icon icon-name="utility:ban" size="small" variant="inverse" class="slds-m-right_x-small"></lightning-icon>
                                <h2><strong>THIS TICKET IS VOID (CANCELLED)</strong> — Admission will be denied at venue check-in.</h2>
                            </div>
                        </template>

                        <!-- Key Information Banner -->
                        <div class="slds-grid slds-wrap slds-gutters slds-m-bottom_medium">
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-m-bottom_small">
                                <div class="preview-info-box">
                                    <div class="preview-info-label">
                                        <lightning-icon icon-name="utility:event" size="x-small" class="slds-m-right_xx-small"></lightning-icon>
                                        Date &amp; Time
                                    </div>
                                    <div class="preview-info-value">{previewTicket.formattedStartDate}</div>
                                    <template if:true={previewTicket.formattedEndDate}>
                                        <div class="preview-info-sub">Ends: {previewTicket.formattedEndDate}</div>
                                    </template>
                                </div>
                            </div>
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-m-bottom_small">
                                <div class="preview-info-box">
                                    <div class="preview-info-label">
                                        <lightning-icon icon-name="utility:checkin" size="x-small" class="slds-m-right_xx-small"></lightning-icon>
                                        Venue Location
                                    </div>
                                    <div class="preview-info-value">{previewTicket.venueName}</div>
                                    <div class="preview-info-sub">{previewTicket.venueAddress}, {previewTicket.venueCity}</div>
                                </div>
                            </div>
                        </div>

                        <!-- Attendee & Pass Details -->
                        <div class="slds-box slds-m-bottom_medium preview-attendee-card">
                            <div class="slds-grid slds-wrap slds-gutters">
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12 slds-m-bottom_x-small">
                                    <span class="preview-field-label">Attendee Name</span>
                                    <div class="preview-field-val"><strong>{previewTicket.attendeeName}</strong></div>
                                </div>
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12 slds-m-bottom_x-small">
                                    <span class="preview-field-label">Email Address</span>
                                    <div class="preview-field-val">{previewTicket.attendeeEmail}</div>
                                </div>
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12 slds-m-bottom_x-small">
                                    <span class="preview-field-label">Phone</span>
                                    <div class="preview-field-val">{previewTicket.attendeePhone}</div>
                                </div>
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12 slds-m-top_x-small">
                                    <span class="preview-field-label">Ticket Tier</span>
                                    <div class="preview-field-val"><span class="category-badge">{previewTicket.ticketTypeName}</span></div>
                                </div>
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12 slds-m-top_x-small">
                                    <span class="preview-field-label">Registration Code</span>
                                    <div class="preview-field-val"><code>{previewTicket.registrationNumber}</code></div>
                                </div>
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12 slds-m-top_x-small">
                                    <span class="preview-field-label">Booked Price</span>
                                    <div class="preview-field-val text-brand-price">₹{previewTicket.bookedPrice}</div>
                                </div>
                            </div>
                        </div>

                        <!-- Speakers Section -->
                        <div class="slds-m-bottom_medium">
                            <h3 class="preview-section-title">
                                <lightning-icon icon-name="utility:groups" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                                Distinguished Speakers
                            </h3>

                            <template if:true={previewTicket.hasSpeakers}>
                                <div class="slds-grid slds-wrap slds-gutters">
                                    <template for:each={previewTicket.speakers} for:item="spk">
                                        <div key={spk.speakerId} class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-m-bottom_small">
                                            <div class="preview-speaker-card">
                                                <div class="speaker-avatar-circle">
                                                    <lightning-icon icon-name="standard:avatar" size="small"></lightning-icon>
                                                </div>
                                                <div class="speaker-card-details">
                                                    <div class="speaker-name">{spk.name}</div>
                                                    <div class="speaker-org">{spk.organization}</div>
                                                    <div class="slds-m-top_xx-small">
                                                        <span class="speaker-role-pill">{spk.role}</span>
                                                    </div>
                                                    <template if:true={spk.sessionTitle}>
                                                        <div class="speaker-session">"{spk.sessionTitle}"</div>
                                                    </template>
                                                </div>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </template>

                            <template if:false={previewTicket.hasSpeakers}>
                                <div class="slds-box slds-theme_shade slds-text-align_center slds-p-around_medium">
                                    <p class="slds-text-color_weak">Speakers will be announced soon for this event.</p>
                                </div>
                            </template>
                        </div>

                        <!-- Simulated Check-In Barcode -->
                        <div class="preview-barcode-container">
                            <div class="preview-barcode-lines">||| | ||||| |||| | ||| {previewTicket.ticketNumber} ||| | |||||</div>
                            <span class="preview-barcode-text">Scan for digital admission pass entry</span>
                        </div>
                    </div>

                    <footer class="slds-modal__footer slds-grid slds-grid_align-spread">
                        <div class="slds-grid slds-grid_vertical-align-center">
                            <lightning-button 
                                label="Close" 
                                variant="neutral" 
                                onclick={handleClosePreview}
                                class="slds-m-right_x-small">
                            </lightning-button>
                            <template if:true={previewTicket.canCancel}>
                                <lightning-button 
                                    label="Cancel Ticket" 
                                    variant="destructive" 
                                    icon-name="utility:close" 
                                    onclick={handleCancelBookingFromPreview}>
                                </lightning-button>
                            </template>
                        </div>
                        <lightning-button 
                            label="Download Official PDF Pass" 
                            icon-name="utility:download" 
                            variant="brand" 
                            onclick={handlePreviewDownloadPdf}>
                        </lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

    </div>
</template>
